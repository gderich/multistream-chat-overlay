name: Build e publicar instalador

# Roda quando você empurra uma tag de versão, ex: git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # necessário para o Actions publicar a Release neste mesmo repositório

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Build + publicar (Setup.exe e Portable.exe)
        run: npm run build:win -- --publish always
        env:
          # Token automático do próprio GitHub Actions — já tem permissão
          # pra publicar Releases neste repositório. Não precisa criar nada
          # manualmente.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
